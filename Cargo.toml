[package]
name = "eval7-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Jack Buckley"]
description = "Exact seven-card poker hand evaluation using suit canonicalisation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BuckleFace/eval7-rs"
documentation = "https://docs.rs/eval7-rs"
readme = "README.md"
keywords = ["poker", "evaluator", "cards", "texas-holdem", "lookup-table"]
categories = ["algorithms", "game-development"]
include = [
    "/src/**",
    "/benches/evaluator.rs",
    "/data/eval7-ranks-v1.bin",
    "/data/README.md",
    "/examples/basic.rs",
    "/tests/public_api.rs",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
bench-internals = []

[dependencies]

[dev-dependencies]
criterion = "0.8.2"
sha2 = "0.10"

[[bench]]
name = "evaluator"
harness = false
required-features = ["bench-internals"]
