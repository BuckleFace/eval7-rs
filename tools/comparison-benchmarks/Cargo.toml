[package]
name = "eval7-comparison-benchmarks"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
aya_poker = { version = "=0.1.0", default-features = false }
eval7-rs = { path = "../..", features = ["bench-internals"] }
poker = { version = "=0.7.0", default-features = false }
rs_poker = { version = "=5.0.0", default-features = false }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support", "plotters"] }

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "diagnostics"
harness = false

[profile.release]
codegen-units = 1
lto = "thin"

[profile.bench]
codegen-units = 1
lto = "thin"
